name: pascal-llm-ui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3-slim
    container_name: pascal-open-webui
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./config/open-webui.env
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  open-webui-data:
